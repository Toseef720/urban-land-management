{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Urban Land Management{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block styles %}{% endblock %}
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">

            <a href="{% url 'dashboard' %}" class="navbar-brand">
                Urban Land Management
            </a>

            <ul class="navbar-links">
                <li>
                    <a href="{% url 'dashboard' %}">Dashboard</a>
                </li>
                <li>
                    <a href="{% url 'property_list' %}">Properties</a>
                </li>
                <li>
                    <a href="{% url 'dataset_home' %}">Datasets</a>
                </li>
                <li>
                    <a href="{% url 'standardization_home' %}">Standardization</a>
                </li>
                <li>
                    <a href="{% url 'harmonization_home' %}">Harmonization</a>
                </li>
                <li>
                    <a href="{% url 'conflict_dashboard' %}">Conflicts</a>
                </li>
            </ul>

        </div>
    </nav>

    <!-- Main Page Content -->
    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

</body>

</html>
